# Temporary HTTP-only listener for ACME validation. It serves no login page.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/pti-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
