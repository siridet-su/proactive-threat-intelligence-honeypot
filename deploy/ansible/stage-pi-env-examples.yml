---
# Stages non-secret examples and creates private skeletons only when absent.
- name: Stage Pi env examples and missing private skeletons
  hosts: pi_sensors
  become: true
  gather_facts: true
  vars:
    pti_release_id: ""
    pti_manifest_sha256: ""
    pti_env_examples:
      - {src: honeypot-agent.env.example, dest: /etc/honeypot-agent.env.example}
      - {src: processor.env.example, dest: /etc/honeypot/processor.env.example}
      - {src: ti-worker.env.example, dest: /etc/honeypot/ti-worker.env.example}
      - {src: hardware.env.example, dest: /etc/honeypot/hardware.env.example}
      - {src: backup.env.example, dest: /etc/honeypot/backup.env.example}
    pti_private_skeletons:
      - {src: honeypot-agent.env.example, dest: /etc/honeypot-agent.env}
      - {src: processor.env.example, dest: /etc/honeypot/processor.env}
      - {src: ti-worker.env.example, dest: /etc/honeypot/ti-worker.env}
      - {src: hardware.env.example, dest: /etc/honeypot/hardware.env}
      - {src: backup.env.example, dest: /etc/honeypot/backup.env}
  pre_tasks:
    - name: Require one supported prepared target
      ansible.builtin.assert:
        that:
          - groups['pi_sensors'] | length == 1
          - ansible_facts['distribution'] == 'Ubuntu'
          - ansible_facts['distribution_version'] == '24.04'
          - ansible_facts['architecture'] in ['aarch64', 'arm64']
          - pti_release_id is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$')
          - pti_manifest_sha256 is match('^[0-9a-f]{64}$')

    - name: Inspect preparation marker and private-config directory
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /var/lib/pti-installer/prepared-release
        - /etc/honeypot
      register: pti_stage_ancestors

    - name: Require safe prepared state before writing examples
      ansible.builtin.assert:
        that:
          - pti_stage_ancestors.results[0].stat.isreg | default(false)
          - not (pti_stage_ancestors.results[0].stat.islnk | default(false))
          - pti_stage_ancestors.results[0].stat.uid == 0
          - pti_stage_ancestors.results[0].stat.mode == '0644'
          - pti_stage_ancestors.results[1].stat.isdir | default(false)
          - not (pti_stage_ancestors.results[1].stat.islnk | default(false))
          - pti_stage_ancestors.results[1].stat.uid == 0

    - name: Read non-secret preparation marker
      ansible.builtin.slurp:
        src: /var/lib/pti-installer/prepared-release
      register: pti_stage_marker

    - name: Require the same approved release
      ansible.builtin.assert:
        that:
          - (pti_stage_marker.content | b64decode | from_json).schema == 'pti.prepare.v1'
          - (pti_stage_marker.content | b64decode | from_json).state == 'prepared'
          - (pti_stage_marker.content | b64decode | from_json).release_id == pti_release_id
          - (pti_stage_marker.content | b64decode | from_json).manifest_sha256 == pti_manifest_sha256

    - name: Inspect existing example destinations
      ansible.builtin.stat:
        path: "{{ item.dest }}"
        get_checksum: false
        get_mime: false
        get_attributes: false
      loop: "{{ pti_env_examples }}"
      register: pti_stage_existing_examples

    - name: Reject unsafe existing example paths
      ansible.builtin.assert:
        that:
          - not (item.stat.islnk | default(false))
          - not (item.stat.exists | default(false)) or (item.stat.isreg | default(false))
          - not (item.stat.exists | default(false)) or item.stat.uid == 0
        fail_msg: An env example destination is not a root-owned regular file.
      loop: "{{ pti_stage_existing_examples.results }}"
      loop_control:
        label: "{{ item.item.dest }}"

    - name: Inspect actual private env destinations without reading contents
      ansible.builtin.stat:
        path: "{{ item.dest }}"
        get_checksum: false
        get_mime: false
        get_attributes: false
      loop: "{{ pti_private_skeletons }}"
      register: pti_stage_private_files

    - name: Reject symlinked or non-regular private env paths
      ansible.builtin.assert:
        that:
          - not (item.stat.islnk | default(false))
          - not (item.stat.exists | default(false)) or (item.stat.isreg | default(false))
        fail_msg: An existing private env path is unsafe; it will not be replaced.
      loop: "{{ pti_stage_private_files.results }}"
      loop_control:
        label: "{{ item.item.dest }}"

  tasks:
    - name: Place blank examples beside private env paths without replacing existing files
      ansible.builtin.copy:
        src: "env-examples/{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: '0600'
        force: false
      loop: "{{ pti_env_examples }}"

    - name: Create missing private env skeletons without replacing operator files
      ansible.builtin.copy:
        src: "env-examples/{{ item.item.src }}"
        dest: "{{ item.item.dest }}"
        owner: root
        group: root
        mode: '0600'
        force: false
      diff: false
      loop: "{{ pti_stage_private_files.results }}"
      loop_control:
        label: "{{ item.item.dest }}"
      when: not (item.stat.exists | default(false))
