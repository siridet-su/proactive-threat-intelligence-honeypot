---
- name: Populate blank non-secret fresh Pi settings
  hosts: pi_sensors
  become: true
  gather_facts: false
  vars:
    pti_cowrie_interface: wlan0
    pti_cowrie_ssh_port: 2222
    pti_cowrie_telnet_port: 2223
  tasks:
    - name: Fill only missing host-derived values in private skeletons
      ansible.builtin.script: "{{ playbook_dir }}/../../scripts/fill_fresh_nonsecret_env.py --interface {{ pti_cowrie_interface }} --ssh-port {{ pti_cowrie_ssh_port }} --telnet-port {{ pti_cowrie_telnet_port }}"
      register: pti_fresh_env_fill
      changed_when: "'FRESH_ENV_CHANGED' in pti_fresh_env_fill.stdout"
