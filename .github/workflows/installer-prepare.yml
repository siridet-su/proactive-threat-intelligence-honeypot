name: installer-prepare

on:
  pull_request:
    paths:
      - "deploy/ansible/**"
      - "deploy/profiles/**"
      - "scripts/build_sensor_release.py"
      - "scripts/pti_install.py"
      - "scripts/verify_sensor_release.py"
      - "tests/installer/**"
      - ".github/workflows/installer-prepare.yml"
  push:
    branches:
      - main
    paths:
      - "deploy/ansible/**"
      - "deploy/profiles/**"
      - "scripts/build_sensor_release.py"
      - "scripts/pti_install.py"
      - "scripts/verify_sensor_release.py"
      - "tests/installer/**"
      - ".github/workflows/installer-prepare.yml"

permissions:
  contents: read

jobs:
  offline-checks:
    name: Offline installer contract checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pinned Ansible controller
        run: python -m pip install --disable-pip-version-check --no-input ansible-core==2.21.4

      - name: Run installer unit tests and validate JSON profiles
        run: |
          python -m unittest discover -s tests/installer -p 'test_*.py' -q
          python -m json.tool deploy/profiles/pi-host-foundation-ubuntu-2404-arm64.json >/dev/null
          python -m json.tool deploy/profiles/pi-sensor-arm64.json >/dev/null
          python -m json.tool deploy/ansible/install-vars.example.json >/dev/null

      - name: Check Ansible playbook syntax without connecting to a host
        run: |
          printf '[pi_sensors]\nlocalhost ansible_connection=local\n' > /tmp/pti-installer-ci-inventory.ini
          ansible-playbook --syntax-check -i /tmp/pti-installer-ci-inventory.ini deploy/ansible/prepare-pi.yml
