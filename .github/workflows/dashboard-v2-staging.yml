name: dashboard-v2-staging

on:
  pull_request:
    paths:
      - "dashboard-v2/**"
      - ".github/workflows/dashboard-v2-staging.yml"
      - "honeypot-analysis/deployment/dashboard-v2-staging/**"
      - "honeypot-analysis/tests/test_dashboard_v2_staging_contract.py"
  push:
    branches:
      - staging
    paths:
      - "dashboard-v2/**"
      - ".github/workflows/dashboard-v2-staging.yml"
      - "honeypot-analysis/deployment/dashboard-v2-staging/**"
      - "honeypot-analysis/tests/test_dashboard_v2_staging_contract.py"

# Only one staging release may be in flight at a time.  A queued run is kept
# so an older successful run cannot be replaced by a cancelled half-deploy.
concurrency:
  group: dashboard-v2-staging
  cancel-in-progress: false

# Jobs opt into the one read permission they need below.
permissions: {}

jobs:
  ci:
    name: Dashboard staging CI
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: dashboard-v2/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard-v2
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Lint dashboard
        working-directory: dashboard-v2
        run: npm run lint

      - name: Type-check dashboard
        working-directory: dashboard-v2
        run: npx tsc --noEmit --pretty false

      - name: Set up Python for focused backend contract tests
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install focused test dependencies
        working-directory: honeypot-analysis
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt

      - name: Run dashboard BFF and staging contract tests
        working-directory: honeypot-analysis
        run: python -m pytest -q tests/test_dashboard_v2_api_integration_contract.py tests/test_dashboard_v2_staging_contract.py

      - name: Build the staging server
        working-directory: dashboard-v2
        env:
          NEXT_PUBLIC_DASHBOARD_DEPLOYMENT_LABEL: STAGING
          NEXT_PUBLIC_DASHBOARD_BUILD_ID: ${{ github.sha }}
        run: npm run build

      - name: Package the exact tested staging artifact
        working-directory: dashboard-v2
        env:
          NEXT_PUBLIC_DASHBOARD_DEPLOYMENT_LABEL: STAGING
          NEXT_PUBLIC_DASHBOARD_BUILD_ID: ${{ github.sha }}
          STAGING_ARTIFACT_DIR: ${{ runner.temp }}/dashboard-v2-staging-artifacts
        run: node scripts/package-staging.mjs

      - name: Upload the immutable staging artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dashboard-v2-staging-${{ github.sha }}
          path: ${{ runner.temp }}/dashboard-v2-staging-artifacts
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy exact artifact to staging
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    environment:
      name: staging
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download the exact CI artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dashboard-v2-staging-${{ github.sha }}
          path: ${{ runner.temp }}/dashboard-v2-staging-artifact

      - name: Verify artifact identity before SSH transfer
        id: artifact-identity
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          ARTIFACT_DIR: ${{ runner.temp }}/dashboard-v2-staging-artifact
        run: |
          set -euo pipefail
          archive="$ARTIFACT_DIR/dashboard-v2-staging-${EXPECTED_COMMIT}.tar.gz"
          manifest="$archive.manifest.json"
          test -f "$archive"
          test -f "$manifest"
          values="$(node --input-type=module - "$manifest" "$EXPECTED_COMMIT" <<'NODE'
          import { readFile } from "node:fs/promises";
          const [manifestPath, expectedCommit] = process.argv.slice(2);
          const manifest = JSON.parse(await readFile(manifestPath, "utf8"));
          const sha = /^[0-9a-f]{64}$/i;
          const commit = /^[0-9a-f]{40}$/i;
          if (!commit.test(expectedCommit) || manifest.git_commit_sha !== expectedCommit) throw new Error("artifact commit mismatch");
          if (!sha.test(manifest.artifact_sha256) || !sha.test(manifest.package_lock_sha256)) throw new Error("artifact hash metadata invalid");
          if (!commit.test(manifest.git_tree_sha)) throw new Error("artifact tree metadata invalid");
          if (!/^[A-Za-z0-9._-]{1,128}$/.test(String(manifest.ci_run_id))) throw new Error("artifact CI identity invalid");
          if (manifest.deployment_environment !== "staging" || manifest.deployment_label !== "STAGING") throw new Error("artifact is not a staging build");
          if (manifest.artifact_file !== archiveName(expectedCommit)) throw new Error("artifact file name mismatch");
          console.log([manifest.artifact_sha256, manifest.git_tree_sha, manifest.package_lock_sha256, manifest.ci_run_id].join("\t"));
          function archiveName(commitSha) { return `dashboard-v2-staging-${commitSha}.tar.gz`; }
          NODE
          )"
          IFS=$'\t' read -r artifact_sha tree_sha lock_sha run_id <<< "$values"
          [[ "$artifact_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$tree_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$lock_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$run_id" =~ ^[A-Za-z0-9._-]{1,128}$ ]]
          actual_sha="$(sha256sum "$archive" | awk '{print $1}')"
          test "$actual_sha" = "$artifact_sha"
          {
            echo "archive=$archive"
            echo "artifact_sha=$artifact_sha"
            echo "tree_sha=$tree_sha"
            echo "lock_sha=$lock_sha"
            echo "run_id=$run_id"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare pinned SSH credentials
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$STAGING_SSH_HOST" =~ ^[A-Za-z0-9._:-]+$ ]]
          [[ "$STAGING_SSH_PORT" =~ ^[0-9]{1,5}$ ]] && (( STAGING_SSH_PORT >= 1 && STAGING_SSH_PORT <= 65535 ))
          [[ "$STAGING_SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_.-]{0,31}$ ]]
          test -n "$STAGING_SSH_PRIVATE_KEY"
          test -n "$STAGING_SSH_KNOWN_HOSTS"
          key="$RUNNER_TEMP/dashboard-staging-deploy-key"
          known_hosts="$RUNNER_TEMP/dashboard-staging-known-hosts"
          umask 077
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$key"
          printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > "$known_hosts"
          chmod 600 "$key"
          chmod 644 "$known_hosts"
          eval "$(ssh-agent -s)" >/dev/null
          ssh-add "$key" >/dev/null
          {
            echo "STAGING_SSH_HOST=$STAGING_SSH_HOST"
            echo "STAGING_SSH_PORT=$STAGING_SSH_PORT"
            echo "STAGING_SSH_USER=$STAGING_SSH_USER"
            echo "STAGING_SSH_KEY=$key"
            echo "STAGING_SSH_KNOWN_HOSTS=$known_hosts"
          } >> "$GITHUB_ENV"

      - name: Transfer and deploy without production privileges
        shell: bash
        env:
          ARCHIVE: ${{ steps.artifact-identity.outputs.archive }}
          ARTIFACT_SHA: ${{ steps.artifact-identity.outputs.artifact_sha }}
          TREE_SHA: ${{ steps.artifact-identity.outputs.tree_sha }}
          LOCK_SHA: ${{ steps.artifact-identity.outputs.lock_sha }}
          CI_RUN_ID: ${{ steps.artifact-identity.outputs.run_id }}
        run: |
          set -euo pipefail
          ssh_target="${STAGING_SSH_USER}@${STAGING_SSH_HOST}"
          remote_archive="/opt/honeypot-dashboard-v2-staging/incoming/dashboard-v2-staging-${GITHUB_SHA}.tar.gz"
          ssh_opts=(
            -p "$STAGING_SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$STAGING_SSH_KNOWN_HOSTS"
          )
          cleanup() {
            ssh "${ssh_opts[@]}" "$ssh_target" "rm -f -- '$remote_archive'" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          scp -P "$STAGING_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$STAGING_SSH_KNOWN_HOSTS" \
            "$ARCHIVE" "$ssh_target:$remote_archive"
          ssh "${ssh_opts[@]}" "$ssh_target" \
            "sudo -n /opt/honeypot-dashboard-v2-staging/bin/deploy-staging --artifact '$remote_archive' --sha256 '$ARTIFACT_SHA' --commit '$GITHUB_SHA' --tree '$TREE_SHA' --lock-sha256 '$LOCK_SHA' --run-id '$CI_RUN_ID'"
