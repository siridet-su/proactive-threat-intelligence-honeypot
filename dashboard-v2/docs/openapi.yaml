  /api/auth:
    post:
      tags: [auth]
      summary: Establish dashboard session
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AuthRequest'}}}}
      responses: {200: {description: Authenticated, headers: {Set-Cookie: {schema: {type: string}, description: HttpOnly dashboard session cookie (value intentionally not documented)}}, content: {application/json: {schema: {$ref: '#/components/schemas/AuthSuccess'}}}}, '400': {description: Invalid JSON request}, '401': {description: Invalid operator credentials}, '503': {description: Authentication is not configured}}
    delete:
      tags: [auth]
      summary: Expire dashboard session
      responses: {200: {description: Cookie expired, content: {application/json: {schema: {$ref: '#/components/schemas/AuthSuccess'}}}}}
