  /api/observables:
    get: {tags: [dashboard], security: [{DashboardSession: []}], summary: Observable rows, x-upstream-path: /observables, parameters: [{$ref: '#/components/parameters/Limit'}], responses: {200: {description: Table rows, content: {application/json: {schema: {$ref: '#/components/schemas/TableResponse'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '502': {$ref: '#/components/responses/BadGateway'}, '503': {$ref: '#/components/responses/Unavailable'}}}
  /api/observable-sightings:
