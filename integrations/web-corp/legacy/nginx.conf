server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Archived static-server configuration; the active container uses FastAPI.
    location / {
        try_files $uri $uri/ =404;
    }

    location = /admin/ {
        return 302 /login.html;
    }
}
