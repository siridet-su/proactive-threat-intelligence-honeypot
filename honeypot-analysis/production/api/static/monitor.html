                            <!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel | Intelligence Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        zinc: {
                            950: '#09090b', 900: '#18181b', 800: '#27272a',
                            700: '#3f3f46', 600: '#52525b', 500: '#71717a',
                            400: '#a1a1aa', 300: '#d4d4d8', 100: '#f4f4f5', 50: '#fafafa',
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.25s ease-out forwards',
                        'slide-up': 'slideUp 0.3s ease-out forwards',
                        'pulse-slow': 'pulseSlow 2.5s ease-in-out infinite',
                        'shimmer': 'shimmer 1.8s infinite',
                        'alert-pulse': 'alertPulse 3s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(8px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        pulseSlow: { '0%,100%': { opacity: '1', transform: 'scale(1)' }, '50%': { opacity: '0.5', transform: 'scale(0.85)' } },
                        shimmer: { '0%': { backgroundPosition: '200% 0' }, '100%': { backgroundPosition: '-200% 0' } },
                        alertPulse: { '0%,100%': { boxShadow: '0 0 0 0 rgba(239,68,68,0)' }, '50%': { boxShadow: '0 0 0 4px rgba(239,68,68,0.12)' } },
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --surface-0: #09090b;
            --surface-1: #18181b;
            --surface-2: #27272a;
            --surface-3: #3f3f46;
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --border: #27272a;
            --border-subtle: #1f1f23;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--surface-0);
            color: var(--text-primary);
            font-feature-settings: "cv11","ss01","cv03","cv04";
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }

        .skeleton {
            background: linear-gradient(90deg, #18181b 25%, #232326 50%, #18181b 75%);
            background-size: 200% 100%;
            animation: shimmer 1.8s infinite;
            border-radius: 6px;
        }

        /* Map */
        .leaflet-container { background: #09090b !important; font-family: 'Inter', sans-serif; }
        .leaflet-control-attribution { background: rgba(9,9,11,0.85) !important; color: #52525b !important; font-size: 10px !important; backdrop-filter: blur(8px); border-top: 1px solid #27272a !important; }
        .leaflet-control-attribution a { color: #71717a !important; }
        .leaflet-control-zoom a { background: #18181b !important; border-color: #27272a !important; color: #a1a1aa !important; }
        .leaflet-control-zoom a:hover { background: #27272a !important; color: #fafafa !important; }
        .sentinel-tooltip {
            background: #18181b !important; border: 1px solid #3f3f46 !important; border-radius: 8px !important;
            padding: 8px 12px !important; box-shadow: 0 16px 32px -8px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.03) !important;
            color: #fafafa !important; font-family: 'Inter', sans-serif !important; font-size: 12px !important; backdrop-filter: blur(12px);
        }
        .sentinel-tooltip::before { border-top-color: #3f3f46 !important; }

        /* Cards */
        .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; transition: border-color 0.15s ease; }
        .card:hover { border-color: #3f3f46; }
        .card-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }

        /* Badges */
        .badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 500; border: 1px solid transparent; white-space: nowrap; }
        .badge-completed { background: rgba(16,185,129,0.08); color: #34d399; border-color: rgba(16,185,129,0.2); }
        .badge-running { background: rgba(59,130,246,0.08); color: #60a5fa; border-color: rgba(59,130,246,0.2); }
        .badge-failed { background: rgba(239,68,68,0.08); color: #f87171; border-color: rgba(239,68,68,0.2); }
        .badge-queued { background: rgba(113,113,122,0.08); color: #a1a1aa; border-color: rgba(113,113,122,0.2); }
        .badge-high { background: rgba(239,68,68,0.08); color: #f87171; border-color: rgba(239,68,68,0.2); }
        .badge-medium { background: rgba(245,158,11,0.08); color: #fbbf24; border-color: rgba(245,158,11,0.2); }
        .badge-low { background: rgba(113,113,122,0.08); color: #a1a1aa; border-color: rgba(113,113,122,0.2); }
        .badge-escalate { background: rgba(239,68,68,0.1); color: #f87171; border-color: rgba(239,68,68,0.25); }
        .badge-monitor { background: rgba(245,158,11,0.1); color: #fbbf24; border-color: rgba(245,158,11,0.25); }
        .badge-dismiss { background: rgba(113,113,122,0.08); color: #71717a; border-color: rgba(113,113,122,0.2); }
        .badge-healthy { background: rgba(16,185,129,0.08); color: #34d399; border-color: rgba(16,185,129,0.2); }
        .badge-degraded { background: rgba(239,68,68,0.08); color: #f87171; border-color: rgba(239,68,68,0.2); }
        .badge-warn { background: rgba(245,158,11,0.08); color: #fbbf24; border-color: rgba(245,158,11,0.2); }

        /* Alert banner */
        .alert-banner-critical { background: rgba(239,68,68,0.06); border: 1px solid rgba(239,68,68,0.2); border-radius: 10px; animation: alertPulse 3s ease-in-out infinite; }
        .alert-banner-warn { background: rgba(245,158,11,0.06); border: 1px solid rgba(245,158,11,0.2); border-radius: 10px; }
        .alert-banner-info { background: rgba(59,130,246,0.06); border: 1px solid rgba(59,130,246,0.2); border-radius: 10px; }

        /* Pulse dots */
        .pulse-dot { width: 7px; height: 7px; border-radius: 50%; background: #60a5fa; animation: pulseSlow 2.5s ease-in-out infinite; display: inline-block; }
        .pulse-dot-green { background: #34d399; }
        .pulse-dot-red { background: #f87171; }
        .pulse-dot-amber { background: #fbbf24; }

        /* Chain */
        .chain-node { width: 23px; height: 23px; border-radius: 50%; border: 1.5px solid #3f3f46; background: #18181b; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: #71717a; flex-shrink: 0; position: relative; z-index: 1; }
        .chain-node-active { border-color: #60a5fa; background: rgba(59,130,246,0.08); color: #60a5fa; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        .chain-node-failed { border-color: #f87171; background: rgba(239,68,68,0.08); color: #f87171; }

        /* Score bars */
        .score-bar-track { background: #27272a; border-radius: 99px; height: 4px; overflow: hidden; }
        .score-bar-fill { height: 100%; border-radius: 99px; transition: width 0.7s cubic-bezier(0.16,1,0.3,1); }

        /* Nav */
        .nav-item { display: flex; align-items: center; padding: 7px 12px; font-size: 13.5px; font-weight: 500; border-radius: 8px; transition: all 0.12s ease; color: #71717a; gap: 10px; cursor: pointer; border: 1px solid transparent; text-decoration: none; }
        .nav-item:hover { background: #18181b; color: #d4d4d8; }
        .nav-item.active { background: #18181b; color: #fafafa; border-color: #27272a; }
        .nav-item .nav-icon { width: 15px; height: 15px; flex-shrink: 0; }

        /* Table */
        .data-row { border-bottom: 1px solid #1f1f23; transition: background 0.1s; cursor: pointer; }
        .data-row:hover { background: rgba(255,255,255,0.02); }
        .data-row:last-child { border-bottom: none; }

        /* Metric card */
        .metric-card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 20px; transition: border-color 0.15s; }
        .metric-card:hover { border-color: #3f3f46; }

        /* Section label */
        .section-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #52525b; padding: 0 12px; margin-bottom: 6px; }

        /* Input */
        .search-input { background: #18181b; border: 1px solid #27272a; border-radius: 8px; color: #fafafa; font-size: 13px; transition: border-color 0.15s, box-shadow 0.15s; }
        .search-input:focus { outline: none; border-color: #3f3f46; box-shadow: 0 0 0 3px rgba(255,255,255,0.04); }
        .search-input::placeholder { color: #52525b; }

        /* Lifecycle dots */
        .lifecycle-dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid #27272a; background: #18181b; }
        .lifecycle-dot.done { border-color: #34d399; background: #34d399; }
        .lifecycle-dot.active { border-color: #60a5fa; background: #60a5fa; box-shadow: 0 0 0 3px rgba(59,130,246,0.2); }
        .lifecycle-dot.failed { border-color: #f87171; background: #f87171; }

        .chip { display: inline-flex; align-items: center; padding: 2px 8px; background: #27272a; border-radius: 99px; font-size: 11px; font-weight: 500; color: #a1a1aa; }
        .scroll-panel { overflow-y: auto; scrollbar-width: thin; scrollbar-color: #27272a transparent; }

        /* Signal quality ring */
        .quality-ring { position: relative; display: inline-flex; align-items: center; justify-content: center; }

        /* TTP correlation node */
        .ttp-node { background: #09090b; border: 1px solid #27272a; border-radius: 8px; padding: 6px 10px; font-size: 11px; font-family: 'JetBrains Mono', monospace; color: #a1a1aa; white-space: nowrap; transition: border-color 0.15s, color 0.15s; }
        .ttp-node:hover { border-color: #3f3f46; color: #fafafa; }
        .ttp-node-highlight { border-color: #3b82f6; color: #60a5fa; background: rgba(59,130,246,0.05); }

        /* Divider */
        .divider { height: 1px; background: #1f1f23; }

        /* SMB decision card colors */
        .smb-escalate { border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.04); }
        .smb-monitor { border-color: rgba(245,158,11,0.3); background: rgba(245,158,11,0.04); }
        .smb-dismiss { border-color: rgba(113,113,122,0.25); background: rgba(113,113,122,0.03); }

        /* Intelligence panel tab */
        .intel-tab { padding: 6px 14px; font-size: 12px; font-weight: 500; border-radius: 7px; cursor: pointer; transition: all 0.12s; color: #52525b; border: 1px solid transparent; }
        .intel-tab.active { background: #27272a; color: #fafafa; border-color: #3f3f46; }
        .intel-tab:hover:not(.active) { color: #a1a1aa; }

        /* ── NEW: Threat Intel view styles ── */
        .risk-high { color: #f87171; }
        .risk-med  { color: #fbbf24; }
        .risk-low  { color: #34d399; }

        .camp-active  { background: rgba(239,68,68,0.06);  border-color: rgba(239,68,68,0.2); }
        .camp-monitor { background: rgba(245,158,11,0.06); border-color: rgba(245,158,11,0.2); }
        .camp-closed  { background: rgba(113,113,122,0.04); border-color: rgba(113,113,122,0.15); }

        .hunt-match-high { color: #f87171; font-weight: 600; }
        .hunt-match-med  { color: #fbbf24; font-weight: 600; }

        .feed-ok   { background: rgba(52,211,153,0.04); border-color: rgba(52,211,153,0.12); }
        .feed-bad  { background: rgba(239,68,68,0.05);  border-color: rgba(239,68,68,0.18); }

        .sev-critical { background: rgba(220,38,38,0.12);  color: #fca5a5; border: 1px solid rgba(220,38,38,0.25); }
        .sev-high     { background: rgba(239,68,68,0.08);  color: #f87171; border: 1px solid rgba(239,68,68,0.2); }
        .sev-medium   { background: rgba(245,158,11,0.08); color: #fbbf24; border: 1px solid rgba(245,158,11,0.2); }
        .sev-low      { background: rgba(113,113,122,0.08);color: #a1a1aa; border: 1px solid rgba(113,113,122,0.2); }

        /* exec summary strip */
        .exec-kpi { background: #09090b; border: 1px solid #1f1f23; border-radius: 10px; padding: 14px 18px; }
    </style>
</head>

    <script>
    /**
     * Sentinel Intelligence Platform — Extended with proactive threat intelligence.
     *
     * APIs consumed [2]:
     *   /api/sessions               monitor_web.py
     *   /api/session                monitor_web.py
     *   /predictions/current        dashboard_api.py → predictive_alert, trust_status,
     *                               confidence_damping, agreement, coverage,
     *                               effective_weights, external_seed_weight_policy,
     *                               session_ttp_correlations, response_guidance,
     *                               source_breakdown, feedback_summary
     *   /decisions/current          dashboard_api.py → response_guidance.v3
     *   /feedback-review            dashboard_api.py → labels, operator_signals,
     *                               action_statuses, weight_eligible, feedback_types
     *   /classification-evaluation  dashboard_api.py → report
     *   /external-seed-health       dashboard_api.py → health, model, validation
     *   /health                     dashboard_api.py
     */

    const API = '';
    const SESSION_FETCH_LIMIT = 500;

    const state = {
        view: 'dashboard',
        sessions: [],
        sessionSummary: {},
        sessionOffset: 0,
        sessionMap: {},       // id → session object, for safe onclick lookup
        map: null,
        charts: {},
        intelCache: {},       // keyed by session_id
        miniMap: null,        // Leaflet mini-map for session detail
        detailSessionId: '',  // current detail page, never persisted
        detailEvents: [],     // current public/redacted event rows only
        globalAlerts: [],     // predictive_alert objects surfaced across sessions
        feedbackData: null,
        classificationData: null,
        seedHealthData: null,
    };

    // Global session opener — called from inline onclick (avoids JSON-in-attribute escaping bugs)

    function matchingSessions(query) {
        const q = String(query || '').trim().toLowerCase();
        if (!q) return state.sessions.slice();
        return state.sessions.filter(s => {
            const haystack = [
                s.session_id,
                s.src_ip,
                s.sensor,
                s.analysis_status,
                ...(s.tactics || []),
                ...(s.ttps || []),
            ].filter(Boolean).join(' ').toLowerCase();
            return haystack.includes(q);
        });
    }

    function handleGlobalSearch(value, event = null) {
        const matches = matchingSessions(value);
        if (event?.key === 'Enter' && matches.length === 1) {
            navigateTo('detail', matches[0]);
            return;
        }
        if (state.view === 'sessions' || state.view === 'dashboard') {
            const tbody = document.getElementById('session-tbody');
            if (tbody) {
                tbody.innerHTML = renderSessionRows(matches.slice().sort((a,b)=>new Date(b.updated_at)-new Date(a.updated_at)));
            }
        }
    }

    function openSession(id) {
        const s = state.sessionMap[id];
        if (s) navigateTo('detail', s);
    }
    window.openSession = openSession;

    document.addEventListener('click', event => {
        const row = event.target.closest('[data-open-session]');
        if (!row) return;
        const sessionId = row.dataset.openSession;
        if (sessionId) openSession(sessionId);
    });

    function startClock() {
        const el = document.getElementById('clock-display');

    function escapeHtmlString(value) {
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function sanitizeJson(value) {
        if (Array.isArray(value)) return value.map(sanitizeJson);
        if (value && typeof value === 'object') {
            const out = {};
            for (const [k, v] of Object.entries(value)) out[k] = sanitizeJson(v);
            return out;
        }
        return typeof value === 'string' ? escapeHtmlString(value) : value;
    }

    function parseJsonMaybe(value, fallback = {}) {
        if (!value) return fallback;
        if (typeof value === 'object') return value;
        try {
            const parsed = JSON.parse(value);
            return parsed && typeof parsed === 'object' ? parsed : fallback;
        } catch { return fallback; }
    }

    function arrayMaybe(value) {
        return Array.isArray(value) ? value : [];
    }

    async function apiFetch(path, opts = {}) {
        const sanitize = opts.sanitize !== false;
        try {
            const r = await fetch(`${API}${path}`, { headers: { 'Accept': 'application/json' } });
            if (!r.ok) {
                console.warn('API request failed', path, r.status);
                return null;
            }
            const data = await r.json();
            return sanitize ? sanitizeJson(data) : data;
        } catch (err) {
            console.warn('API request error', path, err);
            return null;
        }
    }

    async function loadInternalCommands(adminToken, requestedSessionId = state.detailSessionId) {
        const sessionId = String(requestedSessionId || '').trim();
        const token = String(adminToken || '').trim();

        const panel = document.getElementById('raw-command-chain');
        if (panel) panel.innerHTML = '<p class="text-xs text-amber-300">Loading sensitive command text…</p>';
        try {
            const response = await fetch(`/api/internal/session-commands?session_id=${encodeURIComponent(sessionId)}`, {
                method: 'GET',
                cache: 'no-store',
                headers: {
                    'Accept': 'application/json',
                    'Authorization': `Bearer ${token}`,
                },
            });
            const payload = await response.json();
            if (!response.ok || payload?.ok !== true) {
                throw new Error(payload?.error || `request failed (${response.status})`);
            }
            if (String(state.detailSessionId || '').trim() !== sessionId) return;
            const mapping = mapSensitiveCommands(state.detailEvents, payload.commands);
            const mappedCommands = mapping.matches.map(item => item.command);
            const updated = applySensitiveCommandsToExecutionChain(mapping.matches);
            if (payload.commands?.length && (!mappedCommands.length || updated !== mappedCommands.length)) {
                if (panel) panel.innerHTML = '<p class="text-xs text-amber-200">Sensitive command text was not mapped to a stable public event reference; privacy placeholders were retained.</p>';
                return;
            }
            if (panel) panel.innerHTML = renderSensitiveCommandChain({...payload, commands: mappedCommands});
        } catch (error) {
            if (panel) panel.innerHTML = `<p class="text-xs text-red-300">Sensitive command view unavailable: ${escapeHtmlString(error?.message || 'authorization failed')}</p>`;
        }
    }

    function normalizedEventType(value) {
        return String(value || '').trim().toLowerCase();
    }

    function stableEventReference(value) {
        const item = value || {};
        return {
            eventId: String(item.event_id || '').trim(),
            timestamp: String(item.timestamp || item.payload?.timestamp || '').trim(),
            eventType: normalizedEventType(item.eventid || item.payload?.eventid),
        };
    }

    function sensitiveCommandMatchesEvent(event, command) {
        const left = stableEventReference(event);
        const right = stableEventReference(command);
        if (left.eventId && right.eventId) {
            return left.eventId === right.eventId
                && (!left.timestamp || !right.timestamp || left.timestamp === right.timestamp);
        }
        if (!left.timestamp || !right.timestamp || left.timestamp !== right.timestamp) return false;
        return !left.eventType || !right.eventType || left.eventType === right.eventType;
    }

    function mapSensitiveCommands(events, commands) {
        const publicEvents = arrayMaybe(events);
        const sensitiveCommands = arrayMaybe(commands);
        const matches = [];
        const unmatched = [];
        const usedEventKeys = new Set();
        for (const command of sensitiveCommands) {
            const commandRef = stableEventReference(command);
            const candidates = publicEvents.filter(candidate => sensitiveCommandMatchesEvent(candidate, command));
            // Event IDs are the durable identity. Timestamp/type fallback is
            // accepted only when it is unambiguous; never guess between rows.
            const event = commandRef.eventId
                ? candidates.find(candidate => stableEventReference(candidate).eventId === commandRef.eventId)
                : candidates.length === 1 ? candidates[0] : null;
            const eventRef = event ? stableEventReference(event) : null;
            const eventKey = eventRef?.eventId || `${eventRef?.timestamp || ''}\u0000${eventRef?.eventType || ''}`;
            if (event && !usedEventKeys.has(eventKey)) {
                usedEventKeys.add(eventKey);
                matches.push({event, command});
            }
            else unmatched.push(command);
        }
        return {matches, unmatched};
    }

    function applySensitiveCommandsToExecutionChain(matches, root = document) {
        let updated = 0;
        for (const match of arrayMaybe(matches)) {
            const reference = stableEventReference(match.event);
            const nodes = Array.from(root.querySelectorAll('.execution-command-text'));
            const node = nodes.find(candidate => (
                String(candidate.dataset.commandEventId || '') === reference.eventId
                && (!reference.timestamp || String(candidate.dataset.commandTimestamp || '') === reference.timestamp)
            )) || nodes.find(candidate => (
                !reference.eventId
                && String(candidate.dataset.commandTimestamp || '') === reference.timestamp
                && (!reference.eventType || String(candidate.dataset.commandEventType || '').toLowerCase() === reference.eventType)
            ));
            if (!node) continue;
            node.textContent = String(match.command?.input ?? '');
            node.dataset.sensitive = 'true';
            updated += 1;
        }
        return updated;
    }

    function renderSensitiveCommandChain(payload) {
        const commands = arrayMaybe(payload?.commands);
        if (!commands.length) return '<p class="text-xs text-zinc-500 italic">No persisted command text is available for this session.</p>';

                const classification = classifications.length
                    ? classifications.map(item => `${escapeHtmlString(item.ttp || 'unmapped')} · ${escapeHtmlString(item.tactic || 'unknown')} · ${escapeHtmlString(item.source || 'unknown')}`).join('<br>')
                    : 'no trusted classification recorded';
                return `<div class="rounded-lg p-3" style="background:#17120a;border:1px solid rgba(245,158,11,0.25)">
                    <div class="flex flex-wrap items-center gap-2 text-[10px] text-amber-200 mb-2">
                        <span>#${index + 1}</span><span>${escapeHtmlString(command.timestamp || 'time unavailable')}</span><span>${escapeHtmlString(command.eventid || 'event id unavailable')}</span>
                    </div>
                    <div class="text-xs text-amber-100 font-mono whitespace-pre-wrap break-words">${escapeHtmlString(command.input || '[no persisted command text]')}</div>
                    <div class="mt-2 pt-2 border-t text-[10px] text-zinc-400" style="border-color:rgba(245,158,11,0.15)"><span class="text-zinc-500">classification:</span><br>${classification}</div>
                </div>`;
            }).join('')}
            <p class="text-[10px] text-amber-200/70">Sensitive: text is the persisted Cowrie input after the sensor privacy boundary. Values scrubbed before persistence cannot be recovered. This view is not part of public API, reports, artifacts, webhooks, or prediction data.</p>
        </div>`;
    }

    // predictions, enrichment, campaigns, actors, or feed metrics. Missing API data

    function deriveStats(sessions) {
        const statusCounts = { completed: 0, running: 0, queued: 0, failed: 0 };
        const tacticFreq = {};
        let totalCommands = 0, maxCommands = 0;
        // Tactic velocity: bucket by 6h windows over last 48h
        const velocityBuckets = {}; // tactic → [8 buckets]
        const now = Date.now();

        for (const s of sessions) {
            const st = (s.analysis_status || '').toLowerCase();
            if (st in statusCounts) statusCounts[st]++;
            totalCommands += s.command_count || 0;
            if ((s.command_count || 0) > maxCommands) maxCommands = s.command_count;
            const age = (now - new Date(s.updated_at).getTime()) / (6 * 3600000);
            const bucket = Math.min(7, Math.max(0, Math.floor(age)));

            for (const t of (s.tactics || [])) {
                tacticFreq[t] = (tacticFreq[t] || 0) + 1;
                if (!velocityBuckets[t]) velocityBuckets[t] = Array(8).fill(0);
                velocityBuckets[t][7 - bucket]++;
            }
        }

        // Compute velocity delta: last 12h vs prior 12h
        const tacticVelocity = {};
        for (const [t, buckets] of Object.entries(velocityBuckets)) {
            const recent = buckets[6] + buckets[7];
            const prior = buckets[4] + buckets[5];
            tacticVelocity[t] = { recent, prior, delta: recent - prior, trend: recent > prior ? 'up' : recent < prior ? 'down' : 'flat' };
        }

        const hourBuckets = Array(24).fill(0);
        for (const s of sessions) {
            const age = (now - new Date(s.updated_at).getTime()) / 3600000;
            if (age < 24) hourBuckets[23 - Math.min(23, Math.floor(age))]++;
        }

        const avgCommands = sessions.length ? (totalCommands / sessions.length).toFixed(1) : 0;
        return { statusCounts, tacticFreq, totalCommands, maxCommands, avgCommands, hourBuckets, tacticVelocity };
    }

            prevOffset: Math.max(offset - limit, 0),

    function toFiniteNumber(value) {
        if (value === null || value === undefined || value === '') return null;
        const n = Number(value);
        return Number.isFinite(n) ? n : null;
    }

    function normalizeGeo(geo) {
        if (!geo || typeof geo !== 'object') return null;
        const lat = toFiniteNumber(geo.latitude ?? geo.lat);
        const lon = toFiniteNumber(geo.longitude ?? geo.lon ?? geo.lng);
        if (lat === null || lon === null || lat < -90 || lat > 90 || lon < -180 || lon > 180) return null;
        return {
            latitude: lat,
            longitude: lon,
            city: geo.city || geo.city_name || '',
            region: geo.region || geo.region_name || '',
            country: geo.country || geo.country_name || '',
            country_code: geo.country_code || geo.country_code2 || geo.country_code3 || '',
            postal_code: geo.postal_code || '',
            timezone: geo.timezone || '',
            asn: geo.asn || '',
            isp: geo.isp || geo.org || geo.organization || '',
            source: geo.source || 'backend',
        };
    }

    function basicPublicIpCheck(ip) {
        const parts = String(ip || '').trim().split('.').map(x => Number(x));
        if (parts.length !== 4 || parts.some(x => !Number.isInteger(x) || x < 0 || x > 255)) return false;
        const [a, b] = parts;
        if (a === 10 || a === 127 || a === 0) return false;
        if (a === 172 && b >= 16 && b <= 31) return false;
        if (a === 192 && b === 168) return false;
        if (a === 169 && b === 254) return false;
        if (a === 100 && b >= 64 && b <= 127) return false;
        if (a >= 224) return false;
        if (a === 192 && b === 0) return false;
        if (a === 192 && b === 88) return false;
        if (a === 198 && (b === 18 || b === 19 || b === 51)) return false;
        if (a === 203 && b === 0) return false;
        return true;
    }

    function sessionIpScope(item) {
        return item?.src_ip_scope || item?.overview?.src_ip_scope || item?.payload?.src_ip_scope || item?.session_payload?.src_ip_scope || '';
    }

    function sessionHasPublicSourceIp(item) {
        if (item?.src_ip_is_public !== undefined) return !!item.src_ip_is_public;
        if (item?.overview?.src_ip_is_public !== undefined) return !!item.overview.src_ip_is_public;
        if (item?.payload?.src_ip_is_public !== undefined) return !!item.payload.src_ip_is_public;
        return basicPublicIpCheck(sessionSourceIp(item));
    }

    function sourceGeo(item) {
        if (!item || typeof item !== 'object' || !sessionHasPublicSourceIp(item)) return null;
        const candidates = [
            item.geo,

            item.geo_context,
            item.source_geo_context,

    }


    function normalizeGeoContext(context) {
        if (!context) return null;
        if (typeof context === 'string') {
            const text = context.trim();
            if (!text) return null;
            const code = /^[A-Za-z]{2}$/.test(text) ? text.toUpperCase() : (COUNTRY_NAME_TO_CODE[text.toUpperCase()] || '');
            if (!code) return null;
            return {
                country: code,
                country_code: code,
                city: '',
                region: '',
                asn: '',
                isp: '',
                timezone: '',
                source: 'backend_enrichment',
                is_tor_exit: false,
                is_vpn: false,
                tags: [],
                provider_status: {},
                updated_at: '',
                expires_at: '',
                has_coordinates: false,
            };
        }
        if (typeof context !== 'object') return null;
        const geo = normalizeGeo(context);
        const tagsRaw = context.tags || context.infrastructure_tags || context.abuse_tags || context.otx_tags || [];
        const tags = Array.isArray(tagsRaw) ? tagsRaw.filter(Boolean).map(String) : (tagsRaw ? [String(tagsRaw)] : []);
        const normalized = {
            ...(geo || {}),
            country: context.country || context.country_name || geo?.country || '',
            country_code: context.country_code || context.country_code2 || context.country_code3 || geo?.country_code || '',
            city: context.city || context.city_name || geo?.city || '',
            region: context.region || context.region_name || geo?.region || '',
            asn: context.asn || context.as_number || '',
            isp: context.isp || context.org || context.organization || '',
            timezone: context.timezone || geo?.timezone || '',
            source: context.source || geo?.source || 'backend',

            updated_at: context.updated_at || context.fetched_at || '',
            expires_at: context.expires_at || '',
            has_coordinates: !!geo,
        };
        const useful = normalized.has_coordinates || normalized.country || normalized.country_code || normalized.asn || normalized.isp || normalized.is_tor_exit || normalized.is_vpn || tags.length;
        return useful ? normalized : null;

        const srcMap = {};
        for (const item of finalRanking) {

    function initSessionMiniMap(session) {
        const el = document.getElementById('session-mini-map');

        }).addTo(map);
        state.miniMap = map;
    }

    // Current API fields: report.by_tactic / tactic_accuracy. Older builds used report.per_class.
    function classificationRows(report) {
        const source = report?.per_class || report?.by_tactic || {};
        return Object.entries(source).map(([name, raw]) => {
            const precision = Number(raw.precision ?? raw.tactic_precision ?? 0) || 0;
            const recall = Number(raw.recall ?? raw.tactic_recall ?? 0) || 0;
            const f1 = Number(raw.f1_score ?? raw.f1 ?? (precision + recall ? (2 * precision * recall) / (precision + recall) : 0)) || 0;
            const support = Number(raw.support ?? raw.cases ?? raw.count ?? 0) || 0;
            return [name, { precision, recall, f1_score: f1, support }];
        });
    }

    function classificationSummary(report) {
        const rows = classificationRows(report);
        const count = rows.length || 1;
        const avg = key => rows.reduce((sum, [, row]) => sum + Number(row[key] || 0), 0) / count;
        return {
            accuracy: Number(report?.accuracy ?? report?.tactic_accuracy ?? 0),
            ttp_accuracy: Number(report?.ttp_accuracy ?? 0),
            macro_precision: report?.macro_avg?.precision ?? avg('precision'),
            macro_recall: report?.macro_avg?.recall ?? avg('recall'),
            macro_f1: report?.macro_avg?.f1_score ?? avg('f1_score'),
            reviewed_cases: Number(report?.reviewed_cases ?? report?.human_reviewed_cases ?? 0),
            validation_sources: report?.validation_sources || {},
        };
    }

    function feedbackReviewSummary(review, items = []) {
        const rows = arrayMaybe(items);
        const labelCounts = review?.label_counts || review?.labels || {};
        const total = Number(review?.feedback_count ?? review?.count ?? review?.total ?? rows.length) || 0;
        const typeCounts = {};
        const signalCounts = {};
        const actionCounts = {};
        let shownEligible = 0;
        let latest = review?.latest_created_at || '';
        for (const row of rows) {
            const type = String(row.feedback_type || 'legacy');
            typeCounts[type] = (typeCounts[type] || 0) + 1;
            if (row.operator_signal) {
                const signal = String(row.operator_signal);
                signalCounts[signal] = (signalCounts[signal] || 0) + 1;
            }
            if (row.action_status) {
                const status = String(row.action_status);
                actionCounts[status] = (actionCounts[status] || 0) + 1;
            }
            if (row.weight_eligible) shownEligible += 1;
            if (row.created_at && String(row.created_at) > latest) latest = String(row.created_at);
        }
        const filterCounts = review?.filter_counts || {};
        const reviewCandidates = Number(filterCounts.high_confidence_wrong || 0)
            + Number(filterCounts.classification_error || 0)
            + Number(filterCounts.missing_transition_evidence || 0)
            + Number(filterCounts.policy_review || 0);
        return {
            total,

    function externalSeedSummary(rawHealth) {
        const h = rawHealth || {};
        const model = h.model || {};
        const validation = h.validation || {};
        const quality = h.classification_quality || {};
        const reviewQueue = h.review_queue || {};
        const warnings = arrayMaybe(h.warnings);
        const available = Boolean(h.available ?? h.model_exists ?? model.model_id ?? model.path);
        const validationScore = Number(validation.top3_accuracy ?? validation.top1_accuracy ?? h.validation_score ?? 0) || 0;
        let status = h.status || '';
        if (!status) {
            if (!available) status = 'missing';
            else if (warnings.length) status = 'warning';
            else status = 'healthy';
        }
        return {
            available,
            status,
            model_exists: available,
            model_path: model.path || h.model_path || h.paths?.model || '',
            model_id: model.model_id || '',
            built_at: model.built_at || '',
            dataset_handle: model.dataset_handle || '',
            source_type: model.source_type || '',
            classifier: model.classifier || '',
            usable_sessions: Number(model.usable_sessions || 0),
            completed_sessions: Number(model.completed_sessions || 0),
            transition_count: Number(model.transition_count || 0),
            tactic_transition_count: Number(model.tactic_transition_count || 0),
            accepted_classification_events: Number(quality.accepted_classification_events || 0),
            raw_command_events: Number(quality.raw_command_events || 0),
            acceptance_rate: Number(quality.acceptance_rate || 0),
            unknown_rate: Number(quality.unknown_rate || 0),
            shell_noise_rate: Number(quality.shell_noise_rate || 0),
            securebert_invocations: Number(quality.securebert_invocations || 0),
            validation_status: validation.total_cases ? (validation.top3_accuracy >= 0.5 ? 'validated' : 'weak') : 'not_run',
            validation_score: validationScore,
            coverage: Number(validation.coverage || 0),
            top1_accuracy: Number(validation.top1_accuracy || 0),
            top3_accuracy: Number(validation.top3_accuracy || 0),
            total_cases: Number(validation.total_cases || 0),
            last_validated: validation.generated_at || h.generated_at || '',

            training_samples: Number(model.usable_sessions || model.completed_sessions || 0),
            warnings,
            notes: warnings.join(' '),
        };
    }

    async function renderDetail(session) {
        state.view = 'detail';
        state.detailSessionId = String(session.session_id || '');
        updateNav('sessions');
        document.getElementById('breadcrumb').innerHTML = `
            <a href="#" onclick="navigateTo('dashboard');return false;" class="hover:text-zinc-100 transition-colors">Overview</a>
            <i data-lucide="chevron-right" class="w-3.5 h-3.5 mx-1 text-zinc-700"></i>
            <span class="text-zinc-400 cursor-pointer hover:text-zinc-100" onclick="navigateTo('sessions')">Sessions</span>
            <i data-lucide="chevron-right" class="w-3.5 h-3.5 mx-1 text-zinc-700"></i>
            <span class="text-zinc-100 font-medium font-mono text-xs">${session.session_id}</span>
        `;

        document.getElementById('app-content').innerHTML = skeletonDetail(session);
        lucide.createIcons();

        // Parallel fetch of all detail data
        const [detail, predResult, aiResult] = await Promise.all([
            fetchSessionDetail(session.session_id),
            fetchPredictionCurrent(session.session_id),
            fetchAIAdvisory(session.session_id),
        ]);

        const ov = (detail && detail.overview) || {};
        const detailContext = {
            ...session,
            ...(detail || {}),
            src_ip: ov.src_ip || session.src_ip,
            geo: ov.geo || detail?.source_geo || session.geo,
            source_geo: ov.source_geo || detail?.source_geo || session.source_geo,
            payload: { ...(session.payload || {}), ...(detail?.session_payload || {}) },
            overview: ov,
        };
        // ``events`` is canonical; retain the legacy alias for older API
        // responses while the deployment rolls forward.
        const canonicalEvents = arrayMaybe(detail?.events);
        const legacyEvents = arrayMaybe(detail?.events_table_rows);
        const events = canonicalEvents.length ? canonicalEvents : legacyEvents;
        state.detailEvents = events;
        const snapshots = (detail && detail.prediction_snapshots) || [];
        const ranking = snapshots[0]?.payload?.final_ranking || [];
        const cp = predResult?.current_prediction || {};
        const smb = predResult?.response_guidance || {};

        // Fields from /predictions/current [2]
        const predictiveAlert = cp.predictive_alert || {};
        const trustStatus = cp.trust_status || {};
        const confidenceDamping = cp.confidence_damping || {};
        const agreement = cp.agreement || {};
        const coverage = cp.coverage || {};
        const effectiveWeights = cp.effective_weights || {};
        const weightInfluenceScope = cp.weight_influence_scope || '';
        const weightPolicy = cp.external_seed_weight_policy || {};
        const sourceBreakdown = cp.source_breakdown || {};
        const ttpCorrelations = cp.session_ttp_correlations || [];
        const ttpSummary = cp.session_ttp_correlation_summary || {};
        const feedbackSummary = cp.feedback_summary || {};
        const calibrationStatus = cp.calibration_status || {};
        const weightCalibration = cp.weight_calibration || {};
        const predictionStatus = cp.prediction_status || (cp.final_ranking?.length ? 'predicted' : 'abstained');
        const predictionStatusReason = cp.prediction_status_reason || '';
        const externalArtifact = cp.external_artifact || {};
        const genericProgressionPrior = cp.generic_progression_prior || {};

        const finalRanking = cp.final_ranking?.length ? cp.final_ranking : ranking;

        // Prefer the privacy-safe semantic marker from the API. Older API
        // responses remain compatible when their event id is available.
        const isCommandEvent = e => e?.command_event === true
            || String(e?.eventid||'').toLowerCase()==='cowrie.command.input'
            || (String(e?.eventid||'').toLowerCase().startsWith('cowrie.')
                && String(e?.eventid||'').toLowerCase().endsWith('.input')
                && String(e?.eventid||'').toLowerCase().includes('[redacted]'));
        const cmdEvents = events.filter(isCommandEvent);
        const commandCount = cmdEvents.length || Number(ov.command_count) || 0;
        // If a legacy response exposes only an aggregate count, preserve the
        // chain shape without inventing command text or event timestamps.
        const chainEvents = cmdEvents.length ? cmdEvents : Array.from(
            {length: commandCount}, () => ({command_event: true, payload: {}})
        );
        const eventTypeCounts = {};
        for (const e of events) {
            const type = (e.eventid||'unknown').split('.').slice(-1)[0];
            eventTypeCounts[type] = (eventTypeCounts[type]||0)+1;
        }

    async function fetchTableData(endpoint, limit = 100) {
        const d = await apiFetch(`${endpoint}?limit=${limit}`, { sanitize: false });
        return arrayMaybe(d?.items);
    }

    function normalizeAlertRow(row) {
        const payload = parseJsonMaybe(row.payload_json || row.payload, {});
        const top = payload.alert || payload;
        const prediction = payload.prediction || payload.current_prediction || {};
        const tactic = top.tactic || prediction.tactic || prediction.predicted_tactic || (prediction.final_ranking || [])[0]?.tactic || '';
        return sanitizeJson({
            ...row,
            alert_type: row.alert_type || top.alert_type || top.type || row.reason || 'stored_alert',
            message: row.message || top.message || top.reason || row.reason || 'Stored alert',
            tactic,
            status: row.status || top.status || (row.delivered === 1 ? 'delivered' : 'open'),
        });
    }

    function normalizeJobRow(row) {
        const payload = parseJsonMaybe(row.payload_json || row.payload, {});
        return sanitizeJson({
            ...row,
            job_type: row.job_type || payload.job_type || payload.type || 'analysis',
            created_at: row.created_at || row.updated_at,
        });
    }

    function normalizeFeedRow(row) {
        const payload = parseJsonMaybe(row.payload_json || row.payload, {});
        return sanitizeJson({
            ...row,
            feed_name: row.feed_name || row.name || payload.name || 'feed',
            label: row.label || payload.label || payload.name || row.name || 'feed',
            status: row.status || payload.status || 'unknown',
            last_updated: row.last_updated || row.updated_at || payload.updated_at,
            record_count: row.record_count || payload.record_count || payload.count || 0,
            error: row.error || payload.error || '',
        });
    }

    function normalizeEnrichmentRecord(row) {
        const payload = parseJsonMaybe(row.payload_json || row.payload, {});
        const summary = payload.summary || {};
        const providerStatus = parseJsonMaybe(row.provider_status_json || payload.provider_status, {});
        const tags = summary.infrastructure_tags || summary.tags || payload.tags || [];
        const risk = Number(summary.risk_score || payload.risk_score || summary.abuse_score || 0) || 0;
        return sanitizeJson({
            ...row,
            record_id: row.record_id || `${row.observable_type || 'obs'}:${row.observable_value || row.value || ''}`,
            observable_id: row.observable_id || `${row.observable_type || 'obs'}:${row.observable_value || row.value || ''}`,
            enrichment_type: row.enrichment_type || row.observable_type || payload.observable_type || 'observable',
            source: row.source || Object.keys(providerStatus).filter(k => providerStatus[k]).join(', ') || payload.source || 'enrichment_cache',
            value: row.value || row.observable_value || payload.observable_value || '',
            risk_score: Math.max(0, Math.min(1, risk > 1 ? risk / 100 : risk)),
            tags: arrayMaybe(tags),
            created_at: row.created_at || row.updated_at || row.last_seen,
        });
    }

    function normalizeEnrichmentJob(row) {
        const payload = parseJsonMaybe(row.payload_json || row.payload, {});
        return sanitizeJson({
            ...row,
            observable_id: row.observable_id || `${row.observable_type || 'obs'}:${row.observable_value || ''}`,
            source: row.source || payload.source || row.observable_type || 'enrichment',
            created_at: row.created_at || row.updated_at,
        });
    }

    function normalizeCampaign(row) {
        const payload = parseJsonMaybe(row.payload_json || row.payload, {});
        const tactics = parseJsonMaybe(row.confirmed_tactics_json || payload.confirmed_tactics, []);
        return sanitizeJson({
            ...row,
            name: row.name || payload.name || row.campaign_id || 'behavioral_cluster',
            status: row.status || payload.status || 'monitoring',
            confidence: Number(row.confidence || payload.confidence || 0),
            tactics: arrayMaybe(tactics),
            threat_actor: '',
            last_seen: row.last_seen || row.updated_at,
        });
    }

    function normalizeCampaignSession(row) {
        return sanitizeJson({ ...row, linked_at: row.linked_at || row.created_at });
    }

    function normalizeObservable(row) {
        const payload = parseJsonMaybe(row.payload_json || row.payload, {});
        const tags = payload.tags || payload.infrastructure_tags || [];
        const risk = Number(row.risk_score || payload.risk_score || payload.abuse_score || 0) || 0;
        return sanitizeJson({
            ...row,
            observable_id: row.observable_id || `${row.observable_type || row.type || 'obs'}:${row.observable_value || row.value || ''}`,
            type: row.type || row.observable_type || payload.observable_type || 'observable',
            value: row.value || row.observable_value || payload.observable_value || '',
            risk_score: Math.max(0, Math.min(1, risk > 1 ? risk / 100 : risk)),
            confidence: Number(row.confidence || payload.confidence || 0),
            tags: arrayMaybe(tags),
            source: row.source || payload.source || 'observed',
        });
    }

    function normalizeObservableSighting(row) {
        const payload = parseJsonMaybe(row.payload_json || row.payload, {});
        return sanitizeJson({
            ...row,
            observable_id: row.observable_id || `${row.observable_type || 'obs'}:${row.observable_value || ''}`,
            seen_at: row.seen_at || row.timestamp || row.created_at,
            context: row.context || row.role || row.source || payload.context || 'observed',
        });
    }

    function normalizeThreatHuntJob(row) {
        const result = parseJsonMaybe(row.result_json || row.payload_json || row.payload, {});
        const matches = result.matches || result.related_sessions || [];
        return sanitizeJson({
            ...row,
            hypothesis: row.hypothesis || row.trigger_reason || `Observable hunt: ${row.observable_type || 'observable'} ${row.observable_value || ''}`,
            ttp_ids: arrayMaybe(result.ttp_ids || result.techniques),
            analyst: row.analyst || 'system',
            sessions_analyzed: row.sessions_analyzed || result.sessions_analyzed || matches.length || 0,
            matches_found: row.matches_found || result.matches_found || matches.length || 0,
        });
    }

    function normalizeSessionLink(row) {
        const reasons = parseJsonMaybe(row.match_reasons_json || row.payload_json || row.payload, []);
        return sanitizeJson({ ...row, link_type: row.link_type || arrayMaybe(reasons).join(', ') || 'related_session' });
    }

    function normalizePredictionSnapshot(row) {
        const payload = parseJsonMaybe(row.payload_json || row.payload, {});
        const ranking = arrayMaybe(payload.final_ranking || payload.ranking || payload.prediction_ranking);
        const top = ranking[0] || {};
        const score = Number(row.confidence ?? top.score ?? payload.score ?? 0) || 0;
        const labelRaw = top.confidence_label ?? payload.confidence_label ?? payload.confidence ?? '';
        const confidenceLabel = typeof labelRaw === 'string' ? labelRaw : '';
        return sanitizeJson({
            ...row,
            payload,
            ranking,
            prediction: row.prediction || top.tactic || payload.predicted_tactic || '',
            confidence: score,
            confidence_label: confidenceLabel,
            created_at: row.created_at || payload.generated_at,
            agreement: payload.agreement || {},
            coverage: payload.coverage || {},
            classification_quality: payload.classification_quality || {},
            trust_status: payload.trust_status || {},
            active_scorers: arrayMaybe(payload.active_scorers),
            active_weights: payload.active_weights || {},
        });
    }

    function normalizeBacktest(row) {
        const payload = parseJsonMaybe(row.payload_json || row.payload, {});
        const metrics = payload.metrics || payload.overall_metrics || payload.overall || payload;
        const top1 = Number(row.top1_accuracy ?? row.accuracy ?? metrics.top1_accuracy ?? metrics.accuracy ?? 0) || 0;
        const top3 = Number(row.top3_accuracy ?? metrics.top3_accuracy ?? 0) || 0;
        const mrr = Number(row.mean_reciprocal_rank ?? metrics.mean_reciprocal_rank ?? metrics.mrr ?? 0) || 0;
        return sanitizeJson({
            ...row,
            payload,
            status: row.status || payload.status || 'completed',
            accuracy: top1,
            top1_accuracy: top1,
            top3_accuracy: top3,
            mean_reciprocal_rank: mrr,
            coverage: Number(row.coverage ?? metrics.coverage ?? 0) || 0,
            sessions_tested: row.sessions_tested || metrics.evaluated_sessions || metrics.evaluated_cases || metrics.case_count || metrics.sessions_tested || 0,
            total_cases: metrics.total_cases || metrics.case_count || 0,
            scorer_disagreement_rate: Number(metrics.scorer_disagreement_rate ?? payload.scorer_disagreement_rate ?? 0) || 0,
            metrics_by_evidence_origin: payload.metrics_by_evidence_origin || {},
            accuracy_by_scorer_source: payload.accuracy_by_scorer_source || {},
            scorer_level_report: payload.scorer_level_report || {},
            generated_at: payload.generated_at || row.created_at,
        });
    }

    function normalizeWebhook(row) {
        const payload = parseJsonMaybe(row.payload_json || row.payload, {});
        return sanitizeJson({
            ...row,
            event_type: row.event_type || payload.event_type || payload.alert_type || row.alert_id || 'webhook_delivery',
            response_code: row.response_code || payload.response_code || '',
            created_at: row.created_at || row.updated_at,
        });
    }

    async function fetchAlerts(limit=100)           { return (await fetchTableData('/alerts',limit)).map(normalizeAlertRow); }
    async function fetchJobs(limit=100)             { return (await fetchTableData('/jobs',limit)).map(normalizeJobRow); }
    async function fetchFeedStatus(limit=50)        { return (await fetchTableData('/feed-status',limit)).map(normalizeFeedRow); }
    async function fetchEnrichmentRecords(limit=100){ return (await fetchTableData('/enrichment-records',limit)).map(normalizeEnrichmentRecord); }
    async function fetchEnrichmentJobs(limit=100)   { return (await fetchTableData('/enrichment-jobs',limit)).map(normalizeEnrichmentJob); }
    async function fetchCampaigns(limit=50)         { return (await fetchTableData('/campaigns',limit)).map(normalizeCampaign); }
    async function fetchCampaignSessions(limit=100) { return (await fetchTableData('/campaign-sessions',limit)).map(normalizeCampaignSession); }
    async function fetchObservables(limit=100)      { return (await fetchTableData('/observables',limit)).map(normalizeObservable); }
    async function fetchObservableSightings(limit=100){ return (await fetchTableData('/observable-sightings',limit)).map(normalizeObservableSighting); }
    async function fetchThreatHuntJobs(limit=50)    { return (await fetchTableData('/threat-hunt-jobs',limit)).map(normalizeThreatHuntJob); }
    async function fetchSessionLinksData(limit=50)  { return (await fetchTableData('/session-links',limit)).map(normalizeSessionLink); }
    async function fetchPredictionSnapshots(limit=100){ return (await fetchTableData('/prediction-snapshots',limit)).map(normalizePredictionSnapshot); }
    async function fetchPredictionBacktests(limit=20) { return (await fetchTableData('/prediction-backtests',limit)).map(normalizeBacktest); }
    async function fetchWebhooks(limit=50)          { return (await fetchTableData('/webhooks',limit)).map(normalizeWebhook); }

    function severityBadge(sev) {
        const s=(sev||'unknown').toLowerCase();
        const styles={
            critical:'background:rgba(220,38,38,0.12);color:#fca5a5;border:1px solid rgba(220,38,38,0.25)',
            high:'background:rgba(239,68,68,0.08);color:#f87171;border:1px solid rgba(239,68,68,0.2)',
            medium:'background:rgba(245,158,11,0.08);color:#fbbf24;border:1px solid rgba(245,158,11,0.2)',
            low:'background:rgba(113,113,122,0.08);color:#a1a1aa;border:1px solid rgba(113,113,122,0.2)',
        };
        return `<span class="badge" style="${styles[s]||styles.low}">${s}</span>`;
    }

    function riskBar(score) {
        const s=Math.round((score||0)*100);
        const c=s>=75?'#f87171':s>=50?'#fbbf24':'#34d399';
        return `<div class="flex items-center gap-2"><div class="score-bar-track" style="width:60px"><div class="score-bar-fill" style="width:${s}%;background:${c}"></div></div><span class="text-xs font-mono" style="color:${c}">${s}%</span></div>`;
    }

    async function renderOpsCenter() {
        state.view='opscenter';

        document.getElementById('app-content').innerHTML=`<div class="p-7"><div class="skeleton h-96 w-full rounded-xl"></div></div>`;

            fetchAlerts(100), fetchJobs(50), fetchFeedStatus(50), fetchEnrichmentJobs(50)

        <div class="p-7 space-y-6 animate-fade-in">

            <!-- Executive KPI row -->

                            return `<div class="flex items-center justify-between px-2 py-1.5 rounded-md" style="background:#09090b"><span class="text-[11px] capitalize flex items-center gap-1.5"><span style="width:6px;height:6px;border-radius:50%;background:${c};display:inline-block"></span>${k}</span><span class="text-[11px] font-semibold font-mono text-zinc-300">${v}</span></div>`;

                                const related = l.session_id_b || l.related_session_id || l.linked_session_id || '—';

                                return `<tr class="data-row">
                                    <td class="px-5 py-3 font-mono text-[11px] text-teal-400">${String(source).slice(0,18)}</td>
                                    <td class="px-5 py-3 font-mono text-[11px] text-zinc-300">${String(related).slice(0,18)}</td>
                                    <td class="px-5 py-3 text-xs text-zinc-500 max-w-xs truncate"><span class="chip text-[10px] mr-1">${l.observable_type || l.link_type || 'match'}</span>${reason}</td>
                                    <td class="px-5 py-3 text-right text-xs font-mono text-zinc-400">${pct(l.confidence)}</td>
                                    <td class="px-5 py-3 text-right text-xs text-zinc-600">${relativeTime(l.created_at || l.updated_at)}</td>
                                </tr>`;
                            }).join('') : `<tr><td colspan="5" class="px-6 py-10 text-center text-sm text-zinc-600 italic">No cross-session links are stored yet.</td></tr>`}</tbody>
                        </table>
                    </div>
                </div>

                <div class="card overflow-hidden">
                    <div class="card-header">
                        <div>
                            <h3 class="text-sm font-semibold text-zinc-100 tracking-tight">Observable Sightings</h3>
                            <p class="text-xs text-zinc-600 mt-0.5">Evidence used for retroactive threat-hunting links</p>
                        </div>
                        <span class="chip">${sightings.length} sightings</span>
                    </div>
                    <div class="overflow-x-auto scroll-panel" style="max-height:340px">
                        <table class="w-full text-left">
                            <thead style="background:#09090b;border-bottom:1px solid #1f1f23;position:sticky;top:0">
                                <tr class="text-zinc-600 text-[10px] uppercase tracking-widest"><th class="px-5 py-3">Session</th><th class="px-5 py-3">Type</th><th class="px-5 py-3">Value</th><th class="px-5 py-3">Context</th><th class="px-5 py-3 text-right">Seen</th></tr>
                            </thead>
                            <tbody>${sightings.length ? sightings.map(s=>`<tr class="data-row">
                                <td class="px-5 py-3 font-mono text-[11px] text-teal-400">${String(s.session_id || '—').slice(0,18)}</td>
                                <td class="px-5 py-3"><span class="chip text-[10px]">${s.observable_type || s.type || 'observable'}</span></td>
                                <td class="px-5 py-3 text-xs text-zinc-300 max-w-xs truncate">${s.observable_value || s.value || '—'}</td>
                                <td class="px-5 py-3 text-xs text-zinc-600">${s.context || '—'}</td>
                                <td class="px-5 py-3 text-right text-xs text-zinc-600">${relativeTime(s.seen_at || s.created_at)}</td>
                            </tr>`).join('') : `<tr><td colspan="5" class="px-6 py-10 text-center text-sm text-zinc-600 italic">No observable sightings are stored yet.</td></tr>`}</tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
                <div class="card p-5">
                    <div class="flex items-center justify-between mb-4">
                        <div>
                            <h3 class="text-sm font-semibold text-zinc-100 tracking-tight">Observable Inventory</h3>
                            <p class="text-xs text-zinc-600 mt-0.5">Tracked IOC types available to threat-hunt correlation</p>
                        </div>
                        <span class="chip">${Object.keys(observableTypes).length} types</span>
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                        ${Object.entries(observableTypes).length ? Object.entries(observableTypes).sort((a,b)=>b[1]-a[1]).slice(0,9).map(([type,count])=>`<div class="rounded-lg px-3 py-3" style="background:#09090b;border:1px solid #1f1f23"><div class="text-lg font-semibold text-zinc-100">${count}</div><div class="text-[10px] text-zinc-600 uppercase tracking-widest mt-1">${type.replace(/_/g,' ')}</div></div>`).join('') : `<div class="col-span-full text-sm text-zinc-600 italic">No observable inventory has been recorded yet.</div>`}
                    </div>
                </div>

                <div class="card overflow-hidden">
                    <div class="card-header">
                        <div>
                            <h3 class="text-sm font-semibold text-zinc-100 tracking-tight">Webhook Audit Log</h3>
                            <p class="text-xs text-zinc-600 mt-0.5">Delivery status for alerts generated by the system</p>
                        </div>
                        <span class="chip">${deliveredWH.length} delivered &middot; ${failedWH.length} failed</span>
                    </div>
                    <div class="scroll-panel" style="max-height:300px">
                        <table class="w-full text-left">
                            <thead style="background:#09090b;border-bottom:1px solid #1f1f23;position:sticky;top:0"><tr class="text-zinc-600 text-[10px] uppercase tracking-widest"><th class="px-5 py-2.5">Event</th><th class="px-5 py-2.5">Status</th><th class="px-5 py-2.5 text-right">Code</th><th class="px-5 py-2.5 text-right">Age</th></tr></thead>
                            <tbody>${webhooks.length ? webhooks.map(w=>{
                                const ok = String(w.status || '').toLowerCase() === 'delivered';
                                return `<tr class="data-row"><td class="px-5 py-2.5 text-xs text-zinc-300">${(w.event_type || '—').replace(/\./g,' &middot; ')}</td><td class="px-5 py-2.5">${statusBadge(w.status)}</td><td class="px-5 py-2.5 text-right font-mono text-xs" style="color:${ok?'#34d399':'#f87171'}">${w.response_code || '—'}</td><td class="px-5 py-2.5 text-right text-xs text-zinc-600">${relativeTime(w.created_at)}</td></tr>`;
                            }).join('') : `<tr><td colspan="4" class="px-6 py-10 text-center text-sm text-zinc-600 italic">No webhook delivery records are stored yet.</td></tr>`}</tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>`;

        setTimeout(()=>{
            destroyCharts();
            lucide.createIcons();
        },50);
    }

    function initMap(containerId, sessions) {
        const el = document.getElementById(containerId);
        if (!el) return;
        if (state.map) { try { state.map.remove(); } catch {} state.map = null; }
        if (typeof L === 'undefined') {
            el.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-center px-6" style="background:#09090b;border-top:1px solid #1f1f23">
                <div class="text-sm font-semibold text-zinc-300">Map library unavailable</div>
                <div class="text-xs text-zinc-600 mt-2 max-w-lg">Leaflet could not be loaded, so geolocation markers cannot be rendered in this browser session.</div>
            </div>`;
            return;
        }
        const allSessions = sessions || [];
        const publicSessions = allSessions.filter(s => sessionHasPublicSourceIp(s));
        const contextSessions = publicSessions.filter(s => sourceGeoContext(s));
        const trustedGeoCount = publicSessions.filter(s => sourceGeo(s)).length;
        const geoSessions = publicSessions
            .map(s => mapPointForSession(s))
            .filter(Boolean);
        const approximateCount = geoSessions.filter(item => item.approximate).length;
        if (!geoSessions.length) {
            el.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-center px-6" style="background:#09090b;border-top:1px solid #1f1f23">
                <div class="text-sm font-semibold text-zinc-300">No public IP map markers available</div>
                <div class="text-xs text-zinc-600 mt-2 max-w-lg">No trusted coordinates or recognized country code were returned by enrichment for the current public IP sessions.</div>
                <div class="mt-4 text-xs text-zinc-500 font-mono">${allSessions.length} sessions · ${publicSessions.length} public IP sessions · ${contextSessions.length} with country/ASN context · 0 mapped</div>
            </div>`;
            return;
        }
        const map = L.map(containerId, {
            zoomControl: true,
            attributionControl: false,
            scrollWheelZoom: false,
        });
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png', {
            subdomains: 'abcd', maxZoom: 12,
        }).addTo(map);
        const bounds = [];
        for (const item of geoSessions) {
            const s = item.session;
            const color = item.approximate ? '#f59e0b' : statusColor(s);
            bounds.push(item.coords);
            const label = `${s.session_id || 'unknown'}<br>${sessionSourceIp(s)}<br>${geoLocationLabel(item.geo)}${item.approximate ? '<br>Approximate country-level marker' : ''}`;
            L.circleMarker(item.coords, {
                radius: Math.max(6, Math.min(16, 5 + Number(s.command_count || 0))),
                fillColor: color,
                color: '#09090b',
                weight: 2,
                opacity: 1,
                fillOpacity: item.approximate ? 0.68 : 0.84,
                dashArray: item.approximate ? '4 4' : null,
            }).addTo(map).bindTooltip(label, { className: 'sentinel-tooltip', permanent: false });
        }
        const legend = L.control({ position: 'bottomleft' });
        legend.onAdd = function () {
            const div = L.DomUtil.create('div', 'sentinel-tooltip');
            div.style.padding = '8px 10px';
            div.style.background = 'rgba(9,9,11,0.86)';
            div.innerHTML = `<div style="font-size:11px;color:#d4d4d8;font-weight:600">Map precision</div><div style="font-size:10px;color:#a1a1aa;margin-top:3px">${trustedGeoCount} trusted coordinate · ${approximateCount} country-level approximate</div>`;
            return div;
        };
        legend.addTo(map);
        map.fitBounds(bounds, { padding: [28, 28], maxZoom: 6 });
        state.map = map;
    }

    function updateNav(active) {
        document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
        const el = document.getElementById(`nav-${active}`);
        if (el) el.classList.add('active');
    }

    function navigateTo(view, data=null) {
        if (view==='dashboard') renderDashboard();
        else if (view==='sessions') renderSessionsPage();
        else if (view==='detail'&&data) renderDetail(data);
        else if (view==='intelligence') renderIntelligence();
        else if (view==='feedback') renderFeedback();
        else if (view==='classification') renderClassification();
        else if (view==='prediction') renderPrediction();
        else if (view==='seedhealth') renderSeedHealth();
        else if (view==='opscenter') renderOpsCenter();
        else if (view==='campaigns') renderCampaigns();
        else if (view==='ioc') renderIOC();
        else if (view==='actions') renderActions();
        else if (view==='threathunt') renderThreatHunt();
    }

    async function init() {
        startClock();
        const health = await checkHealth();
        const sh = document.getElementById('sidebar-health');
        if (!health&&sh) sh.innerHTML=`<span style="width:6px;height:6px;border-radius:50%;background:#fbbf24;display:inline-block"></span><span style="color:#fbbf24">API unavailable</span>`;

        state.sessions = await fetchSessions();
        state.sessions.forEach(s => state.sessionMap[s.session_id] = s);

        // Nav badge for running sessions
        const runCount = state.sessions.filter(s=>s.analysis_status==='running').length;
        const nb = document.getElementById('nav-sessions-count');
        if (nb&&runCount>0) { nb.textContent=runCount; nb.classList.remove('hidden'); }

        // Global alert badge — use stored alerts API instead of sampling a few sessions.
        const alertRows = await fetchAlerts(100);
        const activeAlerts = alertRows.filter(a => {
            const status = String(a.status || 'open').toLowerCase();
            const severity = String(a.severity || '').toLowerCase();
            return !['resolved', 'delivered'].includes(status) && ['critical', 'high'].includes(severity);
        });
        state.globalAlerts = activeAlerts.map(a => ({
            session: state.sessionMap[a.session_id] || { session_id: a.session_id || 'unknown' },
            alert: a,
        }));
        if (activeAlerts.length > 0) {
            const badge = document.getElementById('global-alert-badge');
            document.getElementById('global-alert-text').textContent = `${activeAlerts.length} Active Alert${activeAlerts.length>1?'s':''}`;
            badge?.classList.remove('hidden');
            document.getElementById('nav-intel-alert')?.classList.remove('hidden');
            document.getElementById('nav-opscenter-alert')?.classList.remove('hidden');
        }

        const params = new URLSearchParams(window.location.search);
        const requestedSession = params.get('session_id');
        if (requestedSession) {
            const existing = state.sessionMap[requestedSession] || { session_id: requestedSession, src_ip: '—', analysis_status: 'unknown', tactics: [], command_count: 0, updated_at: new Date().toISOString() };
            if (!state.sessionMap[requestedSession]) {
                state.sessions.unshift(existing);
                state.sessionMap[requestedSession] = existing;
            }
            await renderDetail(existing);
            return;
        }

        await renderDashboard();
    }

    document.addEventListener('DOMContentLoaded', init);
    window.addEventListener('resize', ()=>{
        if (state.map) state.map.invalidateSize();
        if (state.miniMap) state.miniMap.invalidateSize();
        Object.values(state.charts).forEach(c=>{ try { c.resize(); } catch {} });
    });
    </script>
</body>
