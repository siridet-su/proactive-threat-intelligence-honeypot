name: honeypot-analysis-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install core and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build and install the package
        run: python -m pip install --no-deps .
      - name: Validate trusted policies
        run: |
          python -m production.policies.validate_prediction_policy --policy configs/prediction_policy.trusted.json
          python -m production.policies.validate_prediction_policy --policy configs/prediction_policy.transformer_poc.trusted.json
          python -m production.policies.validate_classification_rules --policy configs/classification_rules.trusted.json
          python -m production.policies.validate_session_ttp_correlation_policy --policy configs/session_ttp_correlation.trusted.json
          python -m production.policies.validate_response_guidance_policy --policy configs/response_guidance_policy.v3.json
          python -m production.policies.validate_threat_hypothesis_behavior_policy --policy configs/threat_hypothesis_behavior.trusted.json
      - name: Run complete suite
        run: pytest -q
