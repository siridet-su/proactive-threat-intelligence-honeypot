[Service]
UMask=0077
StandardOutput=null
StandardError=null
Environment=HONEYPOT_COWRIE_OUTPUT_ROOT=/opt/honeypot-cowrie-output/current
Environment=HONEYPOT_COWRIE_CONFIG=/home/cowrie/cowrie/etc/cowrie.cfg
Environment=HONEYPOT_COWRIE_ROOT=/home/cowrie/cowrie
Environment=PYTHONPATH=/opt/honeypot-cowrie-output/current:/home/cowrie/cowrie/src
Environment=PYTHONDONTWRITEBYTECODE=1
ExecStartPre=/home/cowrie/cowrie/cowrie-env/bin/python -m production.tools.cowrie_output_integration validate --config /home/cowrie/cowrie/etc/cowrie.cfg --bundle-root /opt/honeypot-cowrie-output/current --plugin-link /home/cowrie/cowrie/src/cowrie/output/sanitizedjson.py --drop-in /etc/systemd/system/cowrie.service.d/20-sanitized-output.conf --logrotate /etc/logrotate.d/cowrie --live-permissions
ExecStartPre=/home/cowrie/cowrie/cowrie-env/bin/python -m production.tools.cowrie_output_integration plugin-readiness --config /home/cowrie/cowrie/etc/cowrie.cfg --bundle-root /opt/honeypot-cowrie-output/current --plugin-link /home/cowrie/cowrie/src/cowrie/output/sanitizedjson.py --write-state
ExecStart=
ExecStart=/opt/honeypot-cowrie-output/current/deployment/cowrie_output/run-sanitized-cowrie.sh
ExecStartPost=/opt/honeypot-cowrie-output/current/deployment/cowrie_output/check-live-readiness.sh
ReadOnlyPaths=/home/cowrie/users.txt
ReadOnlyPaths=/home/cowrie/cowrie/var/log/cowrie/cowrie_custom.json
