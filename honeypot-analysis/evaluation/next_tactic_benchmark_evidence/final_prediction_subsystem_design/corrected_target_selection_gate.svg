<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title description">
  <title id="title">Frozen Selection gate: aggregate Transformer gain and defense-evasion recall block</title>
  <desc id="description">All five Transformer seeds have higher Selection macro-F1 than hard-backoff VOMM, but zero defense-evasion recall compared with VOMM's six of forty-four, so none is eligible.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #1f2937; }
    .title { font-size: 22px; font-weight: 700; }
    .sub { font-size: 13px; fill: #4b5563; }
    .label { font-size: 12px; }
    .value { font-size: 12px; font-weight: 700; }
    .danger { fill: #991b1b; }
    .axis { stroke: #9ca3af; stroke-width: 1; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
  </style>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="36" y="38" class="title">Corrected-target experiment — frozen Selection gate</text>
  <text x="36" y="60" class="sub">Pre-test values only. Status: BLOCKED_AT_SELECTION. Final Test remains sealed.</text>
  <text x="36" y="98" class="label" font-weight="700">Aggregate Selection macro-F1</text>
  <line x1="160" y1="118" x2="850" y2="118" class="axis"/>
  <line x1="160" y1="145" x2="850" y2="145" class="grid"/>
  <line x1="160" y1="185" x2="850" y2="185" class="grid"/>
  <line x1="160" y1="225" x2="850" y2="225" class="grid"/>
  <text x="160" y="240" class="sub">0.0</text><text x="500" y="240" class="sub">0.5</text><text x="832" y="240" class="sub">1.0</text>
  <text x="36" y="145" class="label">VOMM</text><rect x="160" y="129" width="320" height="18" fill="#2563eb"/><text x="490" y="144" class="value">0.463510</text>
  <text x="36" y="180" class="label">Transformer seeds</text><rect x="160" y="164" width="460" height="18" fill="#059669"/><text x="630" y="179" class="value">0.666149–0.667059</text>
  <text x="36" y="292" class="label" font-weight="700">Reportable defense-evasion recall</text>
  <line x1="160" y1="312" x2="850" y2="312" class="axis"/>
  <text x="36" y="342" class="label">VOMM</text><rect x="160" y="326" width="94" height="18" fill="#2563eb"/><text x="264" y="341" class="value">0.136364 (6/44)</text>
  <text x="36" y="377" class="label">All Transformer seeds</text><line x1="160" y1="374" x2="175" y2="374" stroke="#dc2626" stroke-width="4"/><text x="185" y="379" class="value danger">0.000000 (0/44) — frozen gate blocks every seed</text>
  <rect x="36" y="409" width="888" height="38" rx="4" fill="#fef2f2" stroke="#dc2626"/>
  <text x="52" y="433" class="value danger">Interpretation: aggregate gain is retained; no checkpoint may be selected, calibrated, or evaluated on Final Test.</text>
</svg>
